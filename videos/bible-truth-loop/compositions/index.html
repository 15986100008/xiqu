<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --night: #030302;
        --gold: #e2bb73;
        --ivory: #fff8e8;
      }
      @font-face {
        font-family: "Bible Serif";
        src: local("Songti SC"), local("STSong"), local("SimSun");
        font-style: normal;
        font-weight: 400 800;
        font-display: block;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--night);
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--night);
        font-family: "Bible Serif", serif;
      }
      #visual {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--night);
        perspective: 1500px;
      }
      .frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }
      #closed-bible {
        opacity: 1;
      }
      #open-bible {
        opacity: 0;
      }
      #opening-45,
      #opening-75 {
        opacity: 0;
        transform-style: preserve-3d;
        transform-origin: 50% 70%;
      }
      #room-darkness {
        position: absolute;
        z-index: 8;
        inset: 0;
        background: #000;
        opacity: 0.91;
        pointer-events: none;
      }
      #candle-awakening {
        position: absolute;
        z-index: 9;
        right: 112px;
        top: 78px;
        width: 480px;
        height: 480px;
        border-radius: 50%;
        opacity: 0;
        background: radial-gradient(
          circle,
          rgba(255, 184, 91, 0.3),
          rgba(158, 76, 24, 0.1) 34%,
          transparent 72%
        );
        filter: blur(28px);
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #flame-cover {
        position: absolute;
        z-index: 10;
        right: 76px;
        top: 150px;
        width: 300px;
        height: 330px;
        opacity: 1;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          #050403 0 38%,
          rgba(5, 4, 3, 0.96) 58%,
          transparent 78%
        );
        filter: blur(12px);
        pointer-events: none;
      }
      #opening-pages {
        position: absolute;
        left: 610px;
        top: 540px;
        width: 700px;
        height: 220px;
        border-radius: 50%;
        opacity: 0;
        background: radial-gradient(
          ellipse,
          rgba(255, 236, 185, 0.58),
          rgba(219, 150, 68, 0.14) 48%,
          transparent 76%
        );
        filter: blur(24px);
        transform-origin: 50% 100%;
        pointer-events: none;
      }
      #gold-light {
        position: absolute;
        inset: -15%;
        opacity: 0;
        background: radial-gradient(
          ellipse at 50% 69%,
          rgba(255, 207, 116, 0.3),
          rgba(190, 103, 35, 0.1) 30%,
          transparent 64%
        );
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #treasure-beam {
        position: absolute;
        z-index: 2;
        left: 510px;
        top: 350px;
        width: 900px;
        height: 560px;
        opacity: 0;
        background: radial-gradient(
          ellipse at 50% 75%,
          rgba(255, 225, 155, 0.55),
          rgba(210, 128, 43, 0.18) 38%,
          transparent 72%
        );
        border-radius: 50%;
        filter: blur(36px);
        mix-blend-mode: screen;
        transform-origin: 50% 100%;
        pointer-events: none;
      }
      #light-core {
        position: absolute;
        z-index: 3;
        left: 620px;
        top: 590px;
        width: 680px;
        height: 170px;
        opacity: 0;
        border-radius: 50%;
        background: radial-gradient(
          ellipse,
          rgba(255, 238, 177, 0.7),
          rgba(226, 150, 57, 0.25) 42%,
          transparent 75%
        );
        filter: blur(28px);
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #warm-wash {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: linear-gradient(
          180deg,
          rgba(92, 42, 8, 0.04),
          rgba(196, 105, 36, 0.18)
        );
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #verse {
        position: absolute;
        z-index: 4;
        left: 205px;
        right: 205px;
        bottom: 118px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        column-gap: 0.035em;
        row-gap: 0.12em;
        color: var(--ivory);
        font-size: 54px;
        font-weight: 800;
        line-height: 1.32;
        letter-spacing: 0.035em;
        text-align: center;
        text-shadow:
          0 4px 26px rgba(0, 0, 0, 0.96),
          0 0 26px rgba(226, 187, 115, 0.26);
        opacity: 0;
      }
      #verse .char {
        display: inline-block;
        opacity: 0;
        min-width: 0.56em;
      }
      .gold {
        color: var(--gold);
      }
      #reference {
        position: absolute;
        z-index: 4;
        left: 0;
        right: 0;
        bottom: 67px;
        text-align: center;
        color: rgba(255, 248, 232, 0.7);
        font:
          500 17px/1 Arial,
          sans-serif;
        letter-spacing: 0.42em;
        opacity: 0;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 28%,
          rgba(0, 0, 0, 0.62) 100%
        );
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-g04f" id="stage" data-composition-id="bible-opening" data-start="0" data-duration="10.5" data-fps="30" data-width="1920" data-height="1080">
      <div data-hf-id="hf-obbp" id="visual" class="clip" data-start="0" data-duration="10.5" data-track-index="0">
        <img data-hf-id="hf-65s9" id="closed-bible" class="frame" src="assets/closed-bible-candle.png" alt="烛光旁合上的圣经" data-layout-allow-overflow="true"><img data-hf-id="hf-open45" id="opening-45" class="frame" src="assets/bible-opening-45.png" alt="正在缓慢打开的圣经" data-layout-allow-overflow="true"><img data-hf-id="hf-open75" id="opening-75" class="frame" src="assets/bible-opening-75.png" alt="接近完全打开的圣经" data-layout-allow-overflow="true"><img data-hf-id="hf-4527" id="open-bible" class="frame" src="assets/bible-first-frame.png" alt="打开的圣经" data-layout-allow-overflow="true">
        <div data-hf-id="hf-pz7x" id="opening-pages" aria-hidden="true"></div>
        <div data-hf-id="hf-1uuu" id="gold-light" aria-hidden="true" data-layout-allow-overflow="true"></div>
        <div data-hf-id="hf-kiaw" id="treasure-beam" aria-hidden="true" data-layout-allow-overflow="true"></div>
        <div data-hf-id="hf-k8ki" id="light-core" aria-hidden="true"></div>
        <div data-hf-id="hf-n9rf" id="warm-wash" aria-hidden="true"></div>
        <div data-hf-id="hf-9t4r" id="verse" aria-label="神爱世人，甚至将他的独生子赐给他们，叫一切信他的，不至灭亡，反得永生"></div>
        <div data-hf-id="hf-meyh" id="reference">JOHN 3:16</div>
        <div data-hf-id="hf-mjac" id="vignette" aria-hidden="true"></div>
        <div data-hf-id="hf-6yq5" id="room-darkness" aria-hidden="true"></div>
        <div data-hf-id="hf-o3ah" id="candle-awakening" aria-hidden="true"></div>
        <div data-hf-id="hf-4h4l" id="flame-cover" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const verseText =
        "神爱世人，甚至将他的独生子赐给他们，叫一切信他的，不至灭亡，反得永生";
      const verseEl = document.querySelector("#verse");
      verseText.split("").forEach((character, index) => {
        const span = document.createElement("span");
        span.className =
          "char" +
          ((index >= 11 && index <= 13) || index >= verseText.length - 4
            ? " gold"
            : "");
        span.textContent = character;
        verseEl.appendChild(span);
      });
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#room-darkness",
        { autoAlpha: 0.91 },
        { autoAlpha: 0.46, duration: 2, ease: "sine.inOut" },
        0,
      );
      tl.fromTo(
        "#candle-awakening",
        { autoAlpha: 0, scale: 0.35 },
        { autoAlpha: 0.28, scale: 1, duration: 2, ease: "sine.inOut" },
        0,
      );
      tl.fromTo(
        "#flame-cover",
        { autoAlpha: 1, scale: 1.08 },
        { autoAlpha: 0, scale: 0.65, duration: 2, ease: "sine.inOut" },
        0,
      );
      tl.to(
        "#candle-awakening",
        { autoAlpha: 0.16, duration: 2.1, ease: "sine.inOut" },
        2.05,
      );
      tl.to(
        "#room-darkness",
        { autoAlpha: 0.06, duration: 2.35, ease: "sine.inOut" },
        2,
      );
      tl.to(
        "#closed-bible",
        { scale: 1.006, duration: 0.05, ease: "sine.inOut" },
        2,
      );
      tl.fromTo(
        "#opening-pages",
        { autoAlpha: 0, scaleX: 0.12, scaleY: 0.04, y: 70 },
        {
          autoAlpha: 0.26,
          scaleX: 1,
          scaleY: 1,
          y: 0,
          duration: 2.05,
          ease: "sine.inOut",
        },
        2.1,
      );
      tl.to(
        "#closed-bible",
        {
          autoAlpha: 0,
          x: -28,
          y: 12,
          rotationZ: 1.2,
          scale: 0.975,
          duration: 0.72,
          ease: "sine.inOut",
        },
        2.05,
      );
      tl.fromTo(
        "#opening-45",
        {
          autoAlpha: 0,
          rotationY: 7,
          rotationZ: -2.8,
          x: 72,
          y: 18,
          scale: 1.035,
          filter: "brightness(.62) sepia(.1)",
        },
        {
          autoAlpha: 1,
          rotationY: 2,
          rotationZ: -1.2,
          x: 20,
          y: 6,
          scale: 1.01,
          filter: "brightness(.82) sepia(.08)",
          duration: 0.86,
          ease: "sine.inOut",
        },
        2.18,
      );
      tl.to(
        "#opening-45",
        {
          autoAlpha: 0,
          rotationY: -2,
          rotationZ: 0,
          x: -12,
          y: 0,
          scale: 0.995,
          duration: 0.78,
          ease: "sine.inOut",
        },
        3.12,
      );
      tl.fromTo(
        "#opening-75",
        {
          autoAlpha: 0,
          scale: 1.035,
          x: 46,
          y: 14,
          rotationY: 5,
          rotationZ: -2,
          filter: "brightness(.66) sepia(.12)",
        },
        {
          autoAlpha: 1,
          scale: 1.005,
          x: 0,
          y: 0,
          rotationY: 0,
          rotationZ: 0,
          filter: "brightness(.9) sepia(.06)",
          duration: 0.92,
          ease: "sine.inOut",
        },
        3.05,
      );
      tl.to(
        "#opening-75",
        {
          autoAlpha: 0,
          x: -18,
          scale: 0.995,
          duration: 0.82,
          ease: "sine.inOut",
        },
        4.02,
      );
      tl.fromTo(
        "#open-bible",
        {
          autoAlpha: 0,
          scale: 1.018,
          x: -32,
          y: 8,
          rotationY: 2,
          rotationZ: -0.7,
          filter: "brightness(.72) sepia(.14)",
        },
        {
          autoAlpha: 1,
          scale: 1,
          x: -55,
          y: 0,
          rotationY: 0,
          rotationZ: 0,
          filter: "brightness(.9) sepia(.06)",
          duration: 0.95,
          ease: "sine.inOut",
        },
        3.92,
      );
      tl.to(
        "#opening-pages",
        { autoAlpha: 0.1, scaleY: 1.08, duration: 1, ease: "sine.inOut" },
        4.15,
      );
      tl.fromTo(
        "#gold-light",
        { autoAlpha: 0, scale: 0.72 },
        { autoAlpha: 0.35, scale: 1.04, duration: 2, ease: "sine.inOut" },
        2.15,
      );
      tl.fromTo(
        "#treasure-beam",
        { autoAlpha: 0, scaleX: 0.15, scaleY: 0.04 },
        {
          autoAlpha: 0.42,
          scaleX: 1,
          scaleY: 1,
          duration: 2.1,
          ease: "sine.inOut",
        },
        2.12,
      );
      tl.fromTo(
        "#light-core",
        { autoAlpha: 0, scaleX: 0.08, scaleY: 0.15 },
        {
          scaleX: 1,
          scaleY: 1,
          autoAlpha: 0.55,
          duration: 2,
          ease: "sine.inOut",
        },
        2.18,
      );
      tl.fromTo(
        "#warm-wash",
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 1.5, ease: "sine.inOut" },
        3.3,
      );
      tl.to(
        "#open-bible",
        {
          scale: 1,
          x: -55,
          rotationY: 0,
          rotationZ: 0,
          filter: "brightness(1) sepia(0)",
          duration: 2,
          ease: "sine.inOut",
        },
        4.87,
      );
      tl.to(
        "#gold-light",
        { autoAlpha: 0.18, duration: 1.4, ease: "sine.inOut" },
        4.7,
      );
      tl.to(
        "#treasure-beam",
        { autoAlpha: 0.14, scaleY: 0.9, duration: 1.5, ease: "sine.inOut" },
        4.23,
      );
      tl.to(
        "#light-core",
        { autoAlpha: 0.16, scale: 0.9, duration: 1.4, ease: "sine.inOut" },
        4.18,
      );
      tl.fromTo(
        "#verse",
        { autoAlpha: 0, y: 26, filter: "blur(10px)" },
        {
          autoAlpha: 1,
          y: 0,
          filter: "blur(0px)",
          duration: 0.65,
          ease: "power3.out",
        },
        5.35,
      );
      tl.fromTo(
        "#verse .char",
        {
          autoAlpha: 0,
          x: (index) => ((index % 13) - 6) * 22,
          y: (index) => -250 - Math.floor(index / 13) * 18,
          scale: 0.34,
          rotationX: -68,
          filter: "blur(9px)",
        },
        {
          autoAlpha: 1,
          x: 0,
          y: 0,
          scale: 1,
          rotationX: 0,
          filter: "blur(0px)",
          duration: 0.56,
          stagger: 0.085,
          ease: "back.out(1.75)",
        },
        5.15,
      );
      tl.fromTo(
        "#reference",
        { autoAlpha: 0, y: 10 },
        { autoAlpha: 1, y: 0, duration: 0.7, ease: "power2.out" },
        8.65,
      );
      tl.to(
        "#gold-light",
        { autoAlpha: 0.18, duration: 1.1, ease: "sine.inOut" },
        8.2,
      );
      window.__timelines["bible-opening"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
