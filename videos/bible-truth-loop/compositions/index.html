<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --night: #030302;
        --gold: #e2bb73;
        --ivory: #fff8e8;
      }
      @font-face {
        font-family: "Bible Serif";
        src: local("Songti SC"), local("STSong"), local("SimSun");
        font-style: normal;
        font-weight: 400 800;
        font-display: block;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--night);
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--night);
        font-family: "Bible Serif", serif;
      }
      #visual {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--night);
        perspective: 1500px;
      }
      .frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }
      #closed-bible {
        opacity: 1;
      }
      #open-bible {
        opacity: 0;
      }
      #opening-45,
      #opening-75 {
        opacity: 0;
        transform-style: preserve-3d;
        transform-origin: 50% 70%;
      }
      #room-darkness {
        position: absolute;
        z-index: 8;
        inset: 0;
        background: #000;
        opacity: 0.91;
        pointer-events: none;
      }
      #candle-awakening {
        position: absolute;
        z-index: 9;
        right: 112px;
        top: 78px;
        width: 480px;
        height: 480px;
        border-radius: 50%;
        opacity: 0;
        background: radial-gradient(
          circle,
          rgba(255, 184, 91, 0.3),
          rgba(158, 76, 24, 0.1) 34%,
          transparent 72%
        );
        filter: blur(28px);
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #flame-cover {
        position: absolute;
        z-index: 10;
        right: 76px;
        top: 150px;
        width: 300px;
        height: 330px;
        opacity: 1;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          #050403 0 38%,
          rgba(5, 4, 3, 0.96) 58%,
          transparent 78%
        );
        filter: blur(12px);
        pointer-events: none;
      }
      #opening-pages {
        position: absolute;
        left: 610px;
        top: 540px;
        width: 700px;
        height: 220px;
        border-radius: 50%;
        opacity: 0;
        background: radial-gradient(
          ellipse,
          rgba(255, 236, 185, 0.58),
          rgba(219, 150, 68, 0.14) 48%,
          transparent 76%
        );
        filter: blur(24px);
        transform-origin: 50% 100%;
        pointer-events: none;
      }
      #gold-light {
        position: absolute;
        inset: -15%;
        opacity: 0;
        background: radial-gradient(
          ellipse at 50% 69%,
          rgba(255, 207, 116, 0.3),
          rgba(190, 103, 35, 0.1) 30%,
          transparent 64%
        );
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #treasure-beam {
        position: absolute;
        z-index: 2;
        left: 510px;
        top: 350px;
        width: 900px;
        height: 560px;
        opacity: 0;
        background: radial-gradient(
          ellipse at 50% 75%,
          rgba(255, 225, 155, 0.55),
          rgba(210, 128, 43, 0.18) 38%,
          transparent 72%
        );
        border-radius: 50%;
        filter: blur(36px);
        mix-blend-mode: screen;
        transform-origin: 50% 100%;
        pointer-events: none;
      }
      #light-core {
        position: absolute;
        z-index: 3;
        left: 620px;
        top: 590px;
        width: 680px;
        height: 170px;
        opacity: 0;
        border-radius: 50%;
        background: radial-gradient(
          ellipse,
          rgba(255, 238, 177, 0.7),
          rgba(226, 150, 57, 0.25) 42%,
          transparent 75%
        );
        filter: blur(28px);
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #warm-wash {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: linear-gradient(
          180deg,
          rgba(92, 42, 8, 0.04),
          rgba(196, 105, 36, 0.18)
        );
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #verse {
        position: absolute;
        z-index: 4;
        left: 205px;
        right: 205px;
        bottom: 118px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        column-gap: 0.035em;
        row-gap: 0.12em;
        color: var(--ivory);
        font-size: 54px;
        font-weight: 800;
        line-height: 1.32;
        letter-spacing: 0.035em;
        text-align: center;
        text-shadow:
          0 4px 26px rgba(0, 0, 0, 0.96),
          0 0 26px rgba(226, 187, 115, 0.26);
        opacity: 0;
      }
      #verse .char {
        display: inline-block;
        opacity: 0;
        min-width: 0.56em;
      }
      .gold {
        color: var(--gold);
      }
      #reference {
        position: absolute;
        z-index: 4;
        left: 0;
        right: 0;
        bottom: 67px;
        text-align: center;
        color: rgba(255, 248, 232, 0.7);
        font:
          500 17px/1 Arial,
          sans-serif;
        letter-spacing: 0.42em;
        opacity: 0;
      }
      #final-atmosphere {
        position: absolute;
        z-index: 12;
        inset: 0;
        opacity: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 48%,rgba(221,174,92,.13),rgba(0,0,0,.34) 58%,rgba(0,0,0,.62));
        pointer-events: none;
      }
      #final-title {
        color: #fff9ea;
        font-size: 76px;
        font-weight: 800;
        letter-spacing: .12em;
        text-indent: .12em;
        text-shadow: 0 4px 30px rgba(0,0,0,.9),0 0 38px rgba(238,194,111,.34);
        opacity: 0;
      }
      .star {
        position: absolute;
        width: 8px;
        height: 8px;
        opacity: 0;
        background: #fff0b9;
        clip-path: polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);
        filter: blur(.35px) drop-shadow(0 0 12px rgba(255,214,128,.9));
      }
      .star.s1{left:24%;top:32%}.star.s2{left:35%;top:67%;transform:scale(.55)}.star.s3{left:70%;top:29%;transform:scale(.7)}.star.s4{left:77%;top:63%;transform:scale(.45)}.star.s5{left:56%;top:23%;transform:scale(.4)}.star.s6{left:19%;top:58%;transform:scale(.35)}
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 28%,
          rgba(0, 0, 0, 0.62) 100%
        );
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-g04f" id="stage" data-composition-id="bible-opening" data-start="0" data-duration="14.5" data-fps="60" data-width="1920" data-height="1080">
      <div data-hf-id="hf-obbp" id="visual" class="clip" data-start="0" data-duration="14.5" data-track-index="0">
        <img data-hf-id="hf-65s9" id="closed-bible" class="frame" src="assets/closed-bible-candle.png" alt="烛光旁合上的圣经" data-layout-allow-overflow="true"><img data-hf-id="hf-open45" id="opening-45" class="frame" src="assets/bible-opening-45.png" alt="正在缓慢打开的圣经" data-layout-allow-overflow="true"><img data-hf-id="hf-open75" id="opening-75" class="frame" src="assets/bible-opening-75.png" alt="接近完全打开的圣经" data-layout-allow-overflow="true"><img data-hf-id="hf-4527" id="open-bible" class="frame" src="assets/bible-first-frame.png" alt="打开的圣经" data-layout-allow-overflow="true">
        <div data-hf-id="hf-pz7x" id="opening-pages" aria-hidden="true"></div>
        <div data-hf-id="hf-1uuu" id="gold-light" aria-hidden="true" data-layout-allow-overflow="true"></div>
        <div data-hf-id="hf-kiaw" id="treasure-beam" aria-hidden="true" data-layout-allow-overflow="true"></div>
        <div data-hf-id="hf-k8ki" id="light-core" aria-hidden="true"></div>
        <div data-hf-id="hf-n9rf" id="warm-wash" aria-hidden="true"></div>
        <div data-hf-id="hf-9t4r" id="verse" aria-label="神爱世人，甚至将他的独生子赐给他们，叫一切信他的，不至灭亡，反得永生"></div>
        <div data-hf-id="hf-meyh" id="reference">JOHN 3:16</div>
        <div data-hf-id="hf-mjac" id="vignette" aria-hidden="true"></div>
        <div data-hf-id="hf-6yq5" id="room-darkness" aria-hidden="true"></div>
        <div data-hf-id="hf-o3ah" id="candle-awakening" aria-hidden="true"></div>
        <div data-hf-id="hf-4h4l" id="flame-cover" aria-hidden="true"></div>
        <div data-hf-id="hf-final" id="final-atmosphere" aria-hidden="true"><span class="star s1"></span><span class="star s2"></span><span class="star s3"></span><span class="star s4"></span><span class="star s5"></span><span class="star s6"></span><div id="final-title">罗马西区欢迎您</div></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const verseText =
        "神爱世人，甚至将他的独生子赐给他们，叫一切信他的，不至灭亡，反得永生";
      const verseEl = document.querySelector("#verse");
      verseText.split("").forEach((character, index) => {
        const span = document.createElement("span");
        span.className =
          "char" +
          ((index >= 11 && index <= 13) || index >= verseText.length - 4
            ? " gold"
            : "");
        span.textContent = character;
        verseEl.appendChild(span);
      });
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#room-darkness", { autoAlpha: .91 }, { autoAlpha: .48, duration: 2, ease: "sine.inOut" }, 0);
      tl.fromTo("#candle-awakening", { autoAlpha: 0, scale: .35 }, { autoAlpha: .25, scale: 1, duration: 2, ease: "sine.inOut" }, 0);
      tl.fromTo("#flame-cover", { autoAlpha: 1, scale: 1.08 }, { autoAlpha: 0, scale: .65, duration: 2, ease: "sine.inOut" }, 0);

      /* One continuous book move: slow anticipation, opening arc, centered settle. */
      tl.to("#closed-bible", { scale: 1.055, x: 22, y: -12, rotationZ: -.45, duration: 1.65, ease: "sine.inOut" }, 1.75);
      tl.to("#room-darkness", { autoAlpha: .07, duration: 4.2, ease: "sine.inOut" }, 2);
      tl.fromTo("#opening-pages", { autoAlpha: 0, scaleX: .05, scaleY: .02, y: 78 }, { autoAlpha: .3, scaleX: 1.08, scaleY: 1.08, y: -6, duration: 3.35, ease: "sine.inOut" }, 2.75);
      tl.to("#closed-bible", { autoAlpha: 0, x: -26, y: 10, rotationZ: .9, scale: .985, duration: 1.2, ease: "sine.inOut" }, 3.4);
      tl.fromTo("#opening-45", { autoAlpha: 0, rotationY: 9, rotationZ: -3.2, x: 88, y: 22, scale: 1.055, filter: "brightness(.58) sepia(.14)" }, { autoAlpha: 1, rotationY: 1, rotationZ: -1, x: 14, y: 4, scale: 1.012, filter: "brightness(.86) sepia(.08)", duration: 1.45, ease: "sine.inOut" }, 2.9);
      tl.to("#opening-45", { autoAlpha: 0, rotationY: -2, rotationZ: 0, x: -8, y: 0, scale: 1, duration: .5, ease: "sine.inOut" }, 4.35);
      tl.fromTo("#opening-75", { autoAlpha: 0, scale: 1.045, x: 58, y: 16, rotationY: 6, rotationZ: -2.2, filter: "brightness(.65) sepia(.13)" }, { autoAlpha: 1, scale: 1.006, x: 0, y: 0, rotationY: 0, rotationZ: 0, filter: "brightness(.94) sepia(.04)", duration: 1.2, ease: "sine.inOut" }, 4.35);
      tl.to("#opening-75", { autoAlpha: 0, x: -12, scale: 1, duration: .75, ease: "sine.inOut" }, 5.7);
      tl.fromTo("#open-bible", { autoAlpha: 0, scale: 1.035, x: 34, y: 10, rotationY: 2.4, rotationZ: -.8, filter: "brightness(.7) sepia(.15)" }, { autoAlpha: 1, scale: 1, x: 0, y: 0, rotationY: 0, rotationZ: 0, filter: "brightness(1) sepia(0)", duration: 1.45, ease: "sine.inOut" }, 5.45);

      /* Light is concealed while shut, then leaks and blooms with the opening angle. */
      tl.fromTo("#gold-light", { autoAlpha: 0, scale: .62 }, { autoAlpha: .42, scale: 1.12, duration: 3.5, ease: "sine.inOut" }, 2.85);
      tl.fromTo("#treasure-beam", { autoAlpha: 0, scaleX: .04, scaleY: .015 }, { autoAlpha: .56, scaleX: 1.12, scaleY: 1.12, duration: 3.4, ease: "sine.inOut" }, 2.85);
      tl.fromTo("#light-core", { autoAlpha: 0, scaleX: .03, scaleY: .06 }, { autoAlpha: .7, scaleX: 1.08, scaleY: 1.08, duration: 3.2, ease: "sine.inOut" }, 2.95);
      tl.fromTo("#warm-wash", { autoAlpha: 0 }, { autoAlpha: 1, duration: 2.2, ease: "sine.inOut" }, 4.35);
      tl.to("#treasure-beam", { autoAlpha: .14, scaleY: .92, duration: 1.5, ease: "sine.inOut" }, 6.25);
      tl.to("#light-core", { autoAlpha: .16, scale: .92, duration: 1.5, ease: "sine.inOut" }, 6.15);

      /* The verse rises from the printed page and resolves one character at a time. */
      tl.fromTo("#verse", { autoAlpha: 0, y: 18, filter: "blur(7px)" }, { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: .72, ease: "power3.out" }, 7.35);
      tl.fromTo("#verse .char", { autoAlpha: 0, x: (index) => ((index % 13) - 6) * 7, y: (index) => -128 - Math.floor(index / 13) * 8, scale: .58, rotationX: -42, filter: "blur(6px)" }, { autoAlpha: 1, x: 0, y: 0, scale: 1, rotationX: 0, filter: "blur(0px)", duration: .68, stagger: .072, ease: "power3.out" }, 7.15);
      tl.fromTo("#reference", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: .7, ease: "power2.out" }, 10.15);

      /* Final invitation: the scripture remains, then the Bible softens into atmosphere. */
      tl.to("#verse, #reference", { autoAlpha: 0, y: -10, duration: .65, ease: "sine.inOut" }, 11.15);
      tl.to("#open-bible", { autoAlpha: .5, scale: 1.025, filter: "brightness(.56) blur(10px) sepia(.08)", duration: 1.7, ease: "sine.inOut" }, 11.05);
      tl.fromTo("#final-atmosphere", { autoAlpha: 0 }, { autoAlpha: 1, duration: 1.4, ease: "sine.inOut" }, 11.15);
      tl.fromTo("#final-title", { autoAlpha: 0, y: 26, scale: .96, filter: "blur(12px)" }, { autoAlpha: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 1.35, ease: "power3.out" }, 11.65);
      tl.fromTo(".star", { autoAlpha: 0, scale: .2, rotationZ: -20 }, { autoAlpha: .72, scale: 1, rotationZ: 0, duration: 1.1, stagger: .13, ease: "sine.out" }, 11.9);
      window.__timelines["bible-opening"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
